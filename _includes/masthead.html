{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Main navigation">
        <button id="site-nav-more" class="nav-toggle hidden" type="button" aria-label="More navigation links" aria-expanded="false" aria-controls="site-nav-hidden"><span class="navicon" aria-hidden="true"></span></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist">
            <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
          </li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign navigation_url = link.url %}
            {% else %}
              {% assign navigation_url = link.url | relative_url %}
            {% endif %}
            <li class="masthead__menu-item {% if page.url contains link.url and link.url != '/' %}selected{% endif %}">
              <a href="{{ navigation_url }}">{{ link.title }}</a>
            </li>
          {% endfor %}
          <li class="masthead__menu-item persist tail">
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false"><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true"></i></button>
          </li>
        </ul>
        <ul id="site-nav-hidden" class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
